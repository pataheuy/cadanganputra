<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pufutara Chat - Fixed Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .app-container { 
            width: 100%; max-width: 720px; height: 75vh; 
            background: #fff; border-radius: 12px; overflow: hidden; 
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .wa-header { background: #111; color: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; background: #fff; }
        .active { display: flex; }

        /* Auth Screen */
        .auth-screen { padding: 40px; text-align: center; justify-content: center; align-items: center; }
        .auth-screen input { width: 100%; max-width: 300px; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; display: block; margin-left: auto; margin-right: auto; }
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; max-width: 300px; }
        .btn-black { background: #111; color: #fff; margin-bottom: 10px; }

        /* Chat Area */
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; }
        .msg { max-width: 80%; padding: 10px; border-radius: 10px; font-size: 0.9rem; position: relative; line-height: 1.4; }
        .msg-me { background: #111; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-other { background: #eee; color: #000; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        .input-area { padding: 15px; display: flex; gap: 10px; border-top: 1px solid #eee; background: #fff; }
        .input-area input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        .btn-send { background: #111; color: #fff; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="wa-header">
            <h2 id="headerTitle">Pufutara</h2>
            <button onclick="logout()" id="logoutBtn" style="display:none; color:white; background:none; border:none; cursor:pointer; font-size: 0.8rem;">Logout</button>
        </div>

        <div id="authScreen" class="screen active auth-screen">
            <h1 style="margin-bottom: 20px;">Selamat Datang</h1>
            <input type="email" id="emailIn" placeholder="Email (contoh: user@mail.com)">
            <input type="password" id="passIn" placeholder="Password (min. 6 karakter)">
            <button class="btn btn-black" onclick="handleAuth()">Login / Masuk</button>
            <p id="authErr" style="color:red; font-size:0.8rem; margin-top: 10px;"></p>
        </div>

        <div id="chatScreen" class="screen">
            <div id="chatMessages" class="chat-messages"></div>
            <div class="input-area">
                <input type="text" id="msgIn" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter')sendMessage()">
                <button class="btn-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // Gunakan nama variabel unik agar tidak bentrok dengan library Supabase
        const _CONFIG = {
            URL: 'https://puywjdopumlzvmzbcudr.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1eXdqZG9wdW1senZtemJjdWRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNDE3MTksImV4cCI6MjA4NzkxNzcxOX0.vvThyjtK2SlA9oA9Mr_XOmt1R_tNZk-ib3PO9XpiiSc'
        };

        const _client = window.supabase.createClient(_CONFIG.URL, _CONFIG.KEY);
        let _userEmail = '';

        async function handleAuth() {
            const email = document.getElementById('emailIn').value;
            const password = document.getElementById('passIn').value;
            const errBox = document.getElementById('authErr');
            errBox.innerText = "Sabar, lagi dicek...";

            // Coba login dulu
            const { data, error } = await _client.auth.signInWithPassword({ email, password });
            
            if (error) {
                // Kalau gagal login, otomatis coba daftarin
                const { data: upData, error: upErr } = await _client.auth.signUp({ email, password });
                if (upErr) {
                    errBox.innerText = upErr.message;
                } else {
                    errBox.style.color = "green";
                    errBox.innerText = "Akun dibuat! Silakan klik Login lagi.";
                }
            } else {
                _userEmail = data.user.email;
                enterChat();
            }
        }

        function enterChat() {
            // Sembunyikan login, tampilkan chat
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('headerTitle').innerText = "Grup Global";
            
            loadMessages();
            listenRealtime();
        }

        async function loadMessages() {
            // HANYA ambil kolom yang pasti ada di database kamu (lihat screenshot image_40db09.png)
            const { data, error } = await _client.from('global_chat')
                .select('sender, message')
                .order('id', { ascending: false })
                .limit(50);
            
            if (data) {
                const box = document.getElementById('chatMessages');
                box.innerHTML = '';
                data.reverse().forEach(m => renderMessage(m));
            }
        }

        async function sendMessage() {
            const inp = document.getElementById('msgIn');
            const txt = inp.value.trim();
            if (!txt) return;
            inp.value = '';

            // PAYLOAD BERSIH: Cuma kirim sender dan message
            const { error } = await _client.from('global_chat').insert([{
                sender: _userEmail,
                message: txt
            }]);
            
            if(error) console.error("Kirim gagal:", error.message);
        }

        function renderMessage(m) {
            const box = document.getElementById('chatMessages');
            const isMe = m.sender === _userEmail;
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'msg-me' : 'msg-other'}`;
            div.innerHTML = `<b style="font-size: 0.7rem;">${m.sender.split('@')[0]}</b><br>${m.message}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function listenRealtime() {
            _client.channel('public_chat')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'global_chat' }, payload => {
                    renderMessage(payload.new);
                }).subscribe();
        }

        function logout() { _client.auth.signOut(); location.reload(); }

        // Auto-login kalau session masih ada
        _client.auth.getSession().then(({data}) => {
            if(data.session) {
                _userEmail = data.session.user.email;
                enterChat();
            }
        });
    </script>
</body>
</html>
