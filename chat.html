<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pufutara Chat - Ultra Stable</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .app-container { 
            width: 100%; max-width: 720px; height: 75vh; 
            background: #fff; border-radius: 12px; overflow: hidden; 
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .wa-header { background: #111; color: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; background: #fff; }
        .active { display: flex; }

        /* Auth */
        .auth-screen { padding: 40px; text-align: center; justify-content: center; }
        .auth-screen input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-black { background: #111; color: #fff; margin-bottom: 10px; }

        /* Chat Room */
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; }
        .msg { max-width: 80%; padding: 10px; border-radius: 10px; font-size: 0.9rem; position: relative; }
        .msg-me { background: #111; color: #fff; align-self: flex-end; }
        .msg-other { background: #eee; color: #000; align-self: flex-start; }
        
        .input-area { padding: 15px; display: flex; gap: 10px; border-top: 1px solid #eee; }
        .input-area input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; outline: none; }
        .btn-send { background: #111; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="wa-header">
            <h2 id="headerTitle">Pufutara</h2>
            <button onclick="logout()" id="logoutBtn" style="display:none; color:white; background:none; border:none; cursor:pointer;">Logout</button>
        </div>

        <div id="authScreen" class="screen active auth-screen">
            <h1>Selamat Datang</h1><br>
            <input type="email" id="emailIn" placeholder="Email">
            <input type="password" id="passIn" placeholder="Password">
            <button class="btn btn-black" onclick="login()">Login / Masuk</button>
            <p id="authErr" style="color:red; font-size:0.8rem;"></p>
        </div>

        <div id="chatScreen" class="screen">
            <div id="chatMessages" class="chat-messages"></div>
            <div class="input-area">
                <input type="text" id="msgIn" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter')send()">
                <button class="btn-send" onclick="send()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const URL = 'https://puywjdopumlzvmzbcudr.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1eXdqZG9wdW1senZtemJjdWRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNDE3MTksImV4cCI6MjA4NzkxNzcxOX0.vvThyjtK2SlA9oA9Mr_XOmt1R_tNZk-ib3PO9XpiiSc';
        
        // Pakai nama pufutaraClient supaya tidak bentrok dengan library
        const pufutaraClient = window.supabase.createClient(URL, KEY);

        let userEmail = '';

        async function login() {
            const e = document.getElementById('emailIn').value;
            const p = document.getElementById('passIn').value;
            const { data, error } = await pufutaraClient.auth.signInWithPassword({ email: e, password: p });
            
            if (error) {
                // Jika belum punya akun, otomatis daftarin
                const { error: signUpErr } = await pufutaraClient.auth.signUp({ email: e, password: p });
                if(signUpErr) document.getElementById('authErr').innerText = signUpErr.message;
            } else {
                userEmail = data.user.email;
                goChat();
            }
        }

        function goChat() {
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('chatScreen').classList.add('active');
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('headerTitle').innerText = "Grup Global";
            loadMessages();
            setupRealtime();
        }

        async function loadMessages() {
            // Ambil 50 pesan tanpa cari kolom 'updated_at' atau 'is_read'
            const { data } = await pufutaraClient.from('global_chat')
                .select('id, created_at, sender, message')
                .order('created_at', { ascending: false })
                .limit(50);
            
            if (data) {
                document.getElementById('chatMessages').innerHTML = '';
                data.reverse().forEach(m => render(m));
            }
        }

        async function send() {
            const inp = document.getElementById('msgIn'), txt = inp.value.trim();
            if (!txt) return;
            inp.value = '';

            // PAYLOAD BERSIH: Cuma kirim yang ada di tabel kamu
            const { error } = await pufutaraClient.from('global_chat').insert([{
                sender: userEmail,
                message: txt
            }]);
            
            if(error) console.error("Gagal kirim:", error.message);
        }

        function render(m) {
            const box = document.getElementById('chatMessages');
            const isMe = m.sender === userEmail;
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'msg-me' : 'msg-other'}`;
            div.innerHTML = `<strong>${m.sender.split('@')[0]}</strong><br>${m.message}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function setupRealtime() {
            pufutaraClient.channel('global_pufutara')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'global_chat' }, payload => {
                    render(payload.new);
                }).subscribe();
        }

        function logout() { pufutaraClient.auth.signOut(); location.reload(); }

        // Cek jika sudah login
        pufutaraClient.auth.getSession().then(({data}) => {
            if(data.session) {
                userEmail = data.session.user.email;
                goChat();
            }
        });
    </script>
</body>
</html>
