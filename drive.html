<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pufutara Drive - Cloud Storage</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .app-container { 
            width: 100%; max-width: 900px; height: 85vh; 
            background: #fff; border-radius: 12px; overflow: hidden; 
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header { background: #1a73e8; color: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { font-weight: 500; display: flex; align-items: center; gap: 10px; }
        
        .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; background: #fff; }
        .active { display: flex; }

        /* Auth Screen */
        .auth-screen { padding: 40px; text-align: center; justify-content: center; align-items: center; }
        .auth-screen input { width: 100%; max-width: 300px; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; display: block; margin: 0 auto 10px; }
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; max-width: 300px; transition: 0.2s; }
        .btn-blue { background: #1a73e8; color: #fff; margin-bottom: 10px; }
        .btn-blue:hover { background: #1557b0; }

        /* Drive UI */
        .drive-toolbar { padding: 15px 20px; background: #f8f9fa; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .btn-upload { background: #1a73e8; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; display: flex; gap: 8px; align-items: center; }
        .btn-upload:hover { background: #1557b0; }

        .file-grid { flex: 1; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; align-content: start; }
        
        /* File Cards */
        .file-card { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .file-card:hover { background: #f1f3f4; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .file-icon { font-size: 3rem; }
        .file-preview { width: 100%; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #eee; }
        .file-name { font-size: 0.85rem; color: #3c4043; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .file-size { font-size: 0.7rem; color: #80868b; }

        .delete-btn { position: absolute; top: -8px; right: -8px; background: #ea4335; color: white; border: none; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; display: none; font-weight: bold; font-size: 0.8rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .file-card:hover .delete-btn { display: block; }
        
        /* Empty State */
        .empty-state { grid-column: 1 / -1; text-align: center; color: #80868b; padding-top: 50px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2>☁️ Pufutara Drive</h2>
            <div>
                <small id="userSubtitle" style="display:none; color: #e8eaed; margin-right: 15px;"></small>
                <button onclick="logout()" id="logoutBtn" style="display:none; color:white; background:none; border:none; cursor:pointer; text-decoration: underline;">Keluar</button>
            </div>
        </div>

        <div id="authScreen" class="screen active auth-screen">
            <h1 style="margin-bottom: 20px; color: #1a73e8;">Login Drive</h1>
            <p style="margin-bottom: 20px; font-size: 0.9rem; color: #555;">Gunakan akun Pufutara Chat kamu</p>
            <input type="email" id="emailIn" placeholder="Email">
            <input type="password" id="passIn" placeholder="Password">
            <button class="btn btn-blue" onclick="handleAuth()">Masuk Drive</button>
            <p id="authErr" style="color:red; font-size:0.8rem; margin-top: 10px;"></p>
        </div>

        <div id="driveScreen" class="screen">
            <div class="drive-toolbar">
                <div style="font-weight: bold; color: #555;">Ruang Pribadi Kamu</div>
                <input type="file" id="fileUpload" style="display:none;" onchange="uploadFile()">
                <button class="btn-upload" id="btnUpload" onclick="document.getElementById('fileUpload').click()">
                    <span>➕</span> Upload File
                </button>
            </div>
            
            <div id="fileGrid" class="file-grid">
                </div>
        </div>
    </div>

    <script>
        // Konfigurasi pakai database kamu yang sama persis
        const _CONFIG = {
            URL: 'https://puywjdopumlzvmzbcudr.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1eXdqZG9wdW1senZtemJjdWRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNDE3MTksImV4cCI6MjA4NzkxNzcxOX0.vvThyjtK2SlA9oA9Mr_XOmt1R_tNZk-ib3PO9XpiiSc'
        };

        const _client = window.supabase.createClient(_CONFIG.URL, _CONFIG.KEY);
        const BUCKET_NAME = 'pufutara_files';
        let _userEmail = '';
        let _userFolder = '';

        // --- AUTH ---
        async function handleAuth() {
            const email = document.getElementById('emailIn').value;
            const password = document.getElementById('passIn').value;
            const errBox = document.getElementById('authErr');
            errBox.innerText = "Membuka brankas...";

            const { data, error } = await _client.auth.signInWithPassword({ email, password });
            if (error) {
                errBox.innerText = error.message;
            } else {
                _userEmail = data.user.email;
                enterDrive();
            }
        }

        async function logout() { await _client.auth.signOut(); location.reload(); }

        function enterDrive() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('driveScreen').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            
            // Nama folder diambil dari nama depan email
            _userFolder = _userEmail.split('@')[0]; 
            document.getElementById('userSubtitle').innerText = _userEmail;
            document.getElementById('userSubtitle').style.display = 'inline-block';
            
            loadFiles();
        }

        // --- LOAD FILES ---
        async function loadFiles() {
            const grid = document.getElementById('fileGrid');
            grid.innerHTML = '<div class="empty-state">Memuat file...</div>';

            // Tarik data file khusus dari folder user ini
            const { data, error } = await _client.storage.from(BUCKET_NAME).list(_userFolder + '/');

            if (error) {
                console.error(error);
                grid.innerHTML = `<div class="empty-state" style="color:red;">Gagal memuat: ${error.message}</div>`;
                return;
            }

            // Hilangkan file tersembunyi/placeholder bawaan Supabase (.emptyFolderPlaceholder)
            const validFiles = data.filter(f => f.name !== '.emptyFolderPlaceholder');

            if (validFiles.length === 0) {
                grid.innerHTML = '<div class="empty-state">Drive kamu masih kosong.<br>Klik tombol <b>Upload File</b> di atas.</div>';
                return;
            }

            grid.innerHTML = ''; // Bersihkan loading
            validFiles.forEach(file => renderFileCard(file));
        }

        function renderFileCard(file) {
            const grid = document.getElementById('fileGrid');
            const card = document.createElement('div');
            card.className = 'file-card';

            const filePath = `${_userFolder}/${file.name}`;
            const { data: publicUrlData } = _client.storage.from(BUCKET_NAME).getPublicUrl(filePath);
            const fileUrl = publicUrlData.publicUrl;

            // Logika ikon / preview gambar
            const isImage = file.metadata.mimetype && file.metadata.mimetype.startsWith('image/');
            let visualHtml = '';

            if (isImage) {
                visualHtml = `<img src="${fileUrl}" class="file-preview" alt="preview">`;
            } else {
                // Tentukan emoji berdasarkan ekstensi file
                const ext = file.name.split('.').pop().toLowerCase();
                let icon = '📄';
                if (['pdf'].includes(ext)) icon = '📕';
                if (['zip', 'rar'].includes(ext)) icon = '🗜️';
                if (['mp4', 'mkv'].includes(ext)) icon = '🎬';
                if (['mp3', 'wav'].includes(ext)) icon = '🎵';
                
                visualHtml = `<div class="file-icon">${icon}</div>`;
            }

            // Hitung ukuran file (Bytes ke KB/MB)
            const sizeKB = file.metadata.size / 1024;
            const sizeText = sizeKB > 1024 ? (sizeKB / 1024).toFixed(2) + ' MB' : sizeKB.toFixed(0) + ' KB';

            card.innerHTML = `
                <button class="delete-btn" onclick="deleteFile('${file.name}', event)" title="Hapus File">✕</button>
                ${visualHtml}
                <div class="file-name" title="${file.name}">${file.name}</div>
                <div class="file-size">${sizeText}</div>
            `;

            // Kalau card diklik, buka/download filenya
            card.onclick = () => window.open(fileUrl, '_blank');
            grid.appendChild(card);
        }

        // --- UPLOAD FILE ---
        async function uploadFile() {
            const input = document.getElementById('fileUpload');
            const file = input.files[0];
            if (!file) return;

            // Batas maksimal 15MB biar rapi
            if (file.size > 15 * 1024 * 1024) {
                alert("Maksimal ukuran file 15MB ya Kak!");
                input.value = ''; return;
            }

            const btn = document.getElementById('btnUpload');
            btn.innerHTML = '<span>⏳</span> Mengunggah...';
            btn.disabled = true;

            try {
                // Beri penanda waktu di depan nama file biar kalau upload file yg namanya sama gak nimpa
                const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, ''); // bersihkan spasi & simbol aneh
                const fileName = `${Date.now()}_${safeName}`;
                const filePath = `${_userFolder}/${fileName}`;

                const { error } = await _client.storage.from(BUCKET_NAME).upload(filePath, file);
                
                if (error) throw error;
                
                // Refresh list
                loadFiles();
            } catch (err) {
                alert("Gagal upload: " + err.message);
            } finally {
                btn.innerHTML = '<span>➕</span> Upload File';
                btn.disabled = false;
                input.value = '';
            }
        }

        // --- DELETE FILE ---
        async function deleteFile(fileName, event) {
            event.stopPropagation(); // Biar pas klik hapus, filenya gak kebuka

            if(confirm(`Yakin mau hapus permanen file "${fileName}"?`)) {
                const filePath = `${_userFolder}/${fileName}`;
                const { error } = await _client.storage.from(BUCKET_NAME).remove([filePath]);
                
                if (error) alert("Gagal menghapus: " + error.message);
                else loadFiles(); // Refresh list
            }
        }

        // Auto Login pakai sesi dari Chat (karena database-nya sama)
        _client.auth.getSession().then(({data}) => {
            if(data.session) { _userEmail = data.session.user.email; enterDrive(); }
        });
    </script>
</body>
</html>
